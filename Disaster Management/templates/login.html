{% extends "base.html" %}


{% block title %}

Login | Disaster Management System

{% endblock %}


{% block content %}


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-icon">
            ⚠
        </div>


        <h1>
            Login Credentials
        </h1>


        <p>
            Login to the Disaster Management System
        </p>


        <form method="POST">


            <label>
                Email Address
            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-submit"
            >

                Login

            </button>


        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

</div>


{% endblock %}
