{% extends "base.html" %}


{% block title %}

Register | Disaster Management System

{% endblock %}


{% block content %}


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-icon">
            👤
        </div>


        <h1>
            Create Account
        </h1>


        <p>
            Register for the Disaster Management System
        </p>


        <form method="POST">


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                required
            >


            <button
                type="submit"
                class="auth-submit"
            >

                Register

            </button>


        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>


    </div>

</div>


{% endblock %}
